"$schema" = 'https://starship.rs/config-schema.json'

format = """
$username\
$hostname\
$directory\
$git_branch\
$git_state\
$git_status\
$kubernetes\
$cmd_duration\
$line_break\
$python\
$status\
$character"""

[directory]
style = "bold #7aa2f7"

[character]
success_symbol = "[❯](purple)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](green)"

[git_branch]
format = "[$branch]($style)"
style = "245"

[git_status]
format = "[[(*$conflicted$untracked$modified$staged$renamed$deleted)](218)( $ahead_behind$stashed)]($style) "
style = "cyan"
conflicted = "​"
untracked = "​"
modified = "​"
staged = "​"
renamed = "​"
deleted = "​"
stashed = "≡"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇡${ahead_count}⇣${behind_count}"

[git_state]
format = '\([$state( $progress_current/$progress_total)]($style)\) '
style = "245"

[kubernetes]
disabled = false
format = "[$context(/$namespace)]($style) "
style = "245"

[cmd_duration]
format = "[$duration]($style) "
style = "yellow"

[status]
disabled = false
format = "[$status]($style) "
style = "red"

[python]
format = "[$virtualenv]($style) "
style = "245"
detect_extensions = []
detect_files = []
